<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chart.js SVG browser fixture</title>
<style>
  body { font: 14px Arial, sans-serif; margin: 0; }
  #fixtures { display: grid; gap: 12px; grid-template-columns: repeat(2, 440px); padding: 12px; }
  .fixture { border: 1px solid #cbd5e1; min-height: 280px; }
  .fixture h2 { font-size: 14px; margin: 8px; }
  canvas { display: block; }
</style>
<body>
<div id="fixtures"></div>
<output id="result"></output>
<script type="module">
  window.addEventListener('error', (event) => {
    document.querySelector('#result').textContent = JSON.stringify({error: event.message});
    document.body.dataset.svgReady = 'true';
  });
  import {
    ArcElement, BarController, BarElement, CategoryScale, Chart, DoughnutController, HistogramController,
    BubbleController, Filler, Legend, LineController, LineElement, LinearScale, LogarithmicScale, PieController, PointElement, PolarAreaController, RadialLinearScale, RadarController, ScatterController, TimeScale, TimeSeriesScale, Tooltip, _adapters,
    Title,
  } from '/dist/chart.js';

  Chart.register(ArcElement, BarController, BarElement, BubbleController, CategoryScale, DoughnutController, Filler, HistogramController, Legend, LineController, LineElement, LinearScale, LogarithmicScale, PieController, PointElement, PolarAreaController, RadialLinearScale, RadarController, ScatterController, TimeScale, TimeSeriesScale, Title, Tooltip);
  _adapters._date.override({
    formats: () => ({datetime: 'x', millisecond: 'x', second: 'x', minute: 'x', hour: 'x', day: 'x', week: 'x', month: 'x', quarter: 'x', year: 'x'}),
    parse: (value) => value instanceof Date ? +value : typeof value === 'number' ? value : Date.parse(value),
    format: (value) => new Date(value).toISOString().slice(0, 10),
    add: (value, amount, unit) => value + amount * ({millisecond: 1, second: 1e3, minute: 6e4, hour: 36e5, day: 864e5, week: 6048e5, month: 2592e6, quarter: 7776e6, year: 31536e6}[unit] || 1),
    diff: (a, b, unit) => (a - b) / ({millisecond: 1, second: 1e3, minute: 6e4, hour: 36e5, day: 864e5, week: 6048e5, month: 2592e6, quarter: 7776e6, year: 31536e6}[unit] || 1),
    startOf: (value) => value, endOf: (value) => value,
  });

  const common = {
    animation: false,
    font: {family: 'Arial', size: 14},
    responsive: false,
  };

  const fixtures = [
    ['line', 'line', {labels: ['Январь & <2026>', 'February 🚀', 'March', 'April'], datasets: [{label: 'Revenue & Profit <2026>', data: [2, 5, 3, 6], borderColor: '#2563eb', borderWidth: 3, pointRadius: 3}]}, {
      scales: {x: {ticks: {minRotation: 45, maxRotation: 45}, title: {display: true, text: 'Month'}}, y: {title: {display: true, text: 'Revenue'}}},
    }],
    ['area', 'line', {labels: ['One', 'Two', 'Three', 'Four'], datasets: [{label: 'Area', data: [2, 6, 3, 7], borderColor: '#0f766e', backgroundColor: 'rgba(20, 184, 166, .35)', fill: true, tension: .35}]}, {}],
    ['bar', 'bar', {labels: ['One', 'Two', 'Three'], datasets: [{label: 'Orders', data: [4, 7, 5], backgroundColor: '#f59e0b', borderColor: '#b45309', borderWidth: 2}]}, {}],
    ['histogram', 'histogram', {datasets: [{label: 'Variable bins', data: [{xMin: 0, xMax: 1, y: 2}, {xMin: 1, xMax: 4, y: 5}, {xMin: 4, xMax: 10, y: 3}], backgroundColor: '#38bdf8', borderColor: '#0369a1', borderWidth: 1}]}, {}],
    ['scatter', 'scatter', {datasets: [{label: 'Samples', showLine: true, fill: true, data: [{x: 1, y: 2}, {x: 3, y: 5}, {x: 7, y: -2}], borderColor: '#7c3aed', backgroundColor: 'rgba(124, 58, 237, .2)', pointBackgroundColor: '#c4b5fd', pointRadius: [4, 7, 5], pointStyle: ['circle', 'triangle', 'star']}]}, {}],
    ['bubble', 'bubble', {datasets: [{label: 'Sizes', data: [{x: 1, y: 2, r: 5}, {x: 3, y: 4, r: 14}, {x: 5, y: 1, r: 24}], backgroundColor: 'rgba(16, 185, 129, .55)', borderColor: '#047857'}]}, {}],
    ['log', 'line', {datasets: [{label: 'Log', data: [{x: 1, y: 1}, {x: 2, y: 10}, {x: 5, y: 100}, {x: 10, y: 1000}], borderColor: '#ea580c'}]}, {scales: {x: {type: 'logarithmic'}, y: {type: 'logarithmic'}}}],
    ['time', 'line', {datasets: [{label: 'Time', data: [{x: '2026-01-01', y: 2}, {x: '2026-01-05', y: 5}, {x: '2026-01-20', y: 3}], borderColor: '#0891b2'}]}, {scales: {x: {type: 'time', time: {unit: 'day'}, title: {display: true, text: 'Date'}}, y: {type: 'linear'}}}],
    ['timeseries', 'line', {datasets: [{label: 'Series', data: [{x: '2026-01-01', y: 2}, {x: '2026-01-02', y: 5}, {x: '2026-01-20', y: 3}, {x: '2026-04-10', y: 6}], borderColor: '#be123c'}]}, {scales: {x: {type: 'timeseries', time: {unit: 'day'}}, y: {type: 'linear'}}}],
    ['radar', 'radar', {labels: ['North', 'East', 'South', 'West', 'Center'], datasets: [{label: 'Actual', data: [4, 7, 5, 8, 6], backgroundColor: 'rgba(37, 99, 235, .25)', borderColor: '#2563eb', borderWidth: 2, pointBackgroundColor: '#fff', pointRadius: 4}]}, {
      plugins: {title: {display: true, text: 'Radar overview'}}, scales: {r: {backgroundColor: '#f8fafc', pointLabels: {backdropColor: '#fff', backdropPadding: 2}, ticks: {backdropColor: '#fff'}}},
    }],
    ['polar', 'polarArea', {labels: ['North', 'East', 'South', 'West'], datasets: [{data: [4, 7, 3, 6], backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#ec4899'], borderColor: '#fff', borderWidth: 2}]}, {}],
    ['pie', 'pie', {labels: ['North', 'South', 'West'], datasets: [{data: [4, 3, 5], backgroundColor: ['#2563eb', '#10b981', '#f59e0b'], borderColor: '#fff', borderWidth: 2}]}, {}],
    ['doughnut', 'doughnut', {labels: ['North', 'South', 'West'], datasets: [{data: [4, 3, 5], backgroundColor: ['#7c3aed', '#ec4899', '#22c55e'], borderColor: '#fff', borderWidth: 2}]}, {}],
    ['legend', 'line', {labels: ['One', 'Two', 'Three'], datasets: [{label: 'Ellipse marker', data: [2, 4, 3], borderColor: '#1d4ed8', pointStyle: 'circle', pointRadius: 5}]}, {
      plugins: {legend: {labels: {pointStyleWidth: 30, usePointStyle: true}}},
    }],
  ];

  function mount(name, type, data, options, renderer) {
    const card = document.createElement('section');
    card.className = 'fixture';
    card.dataset.case = `${name}-${renderer}`;
    card.innerHTML = `<h2>${name} (${renderer})</h2>`;
    const host = document.createElement('div');
    host.style.width = '420px';
    host.style.height = '250px';
    card.appendChild(host);
    document.querySelector('#fixtures').appendChild(card);
    return new Chart(host, {type, data, options: {...common, ...options, renderer}});
  }

  const charts = new Map();
  for (const [name, type, data, options] of fixtures) {
    charts.set(`${name}-canvas`, mount(name, type, data, options, 'canvas'));
    charts.set(`${name}-svg`, mount(name, type, data, options, 'svg'));
  }

  function mountPaint(name, type, renderer) {
    const card = document.createElement('section');
    card.className = 'fixture';
    card.dataset.case = `${name}-${renderer}`;
    card.innerHTML = `<h2>${name} (${renderer})</h2>`;
    const canvas = document.createElement('canvas');
    canvas.width = 420;
    canvas.height = 250;
    card.appendChild(canvas);
    document.querySelector('#fixtures').appendChild(card);
    const linear = {
      type: 'linear-gradient', x0: 0, y0: 0, x1: canvas.width, y1: 0,
      colorStops: [{offset: 0, color: 'rgba(37, 99, 235, .15)'}, {offset: .5, color: '#8b5cf6'}, {offset: 1, color: '#ec4899'}]
    };
    const radial = {
      type: 'radial-gradient', x0: 210, y0: 125, r0: 10, x1: 210, y1: 125, r1: 180,
      colorStops: [{offset: 0, color: 'rgba(16, 185, 129, .7)'}, {offset: 1, color: 'rgba(16, 185, 129, .05)'}]
    };
    const patternImage = new Image(10, 10);
    patternImage.src = 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2210%22%20height%3D%2210%22%3E%3Crect%20width%3D%2210%22%20height%3D%2210%22%20fill%3D%22%23f59e0b%22%2F%3E%3Cpath%20d%3D%22M0%200h5v5H0zM5%205h5v5H5z%22%20fill%3D%22%237c2d12%22%2F%3E%3C%2Fsvg%3E';
    const pattern = {type: 'pattern', image: patternImage, repetition: 'repeat'};
    const icon = document.createElement('canvas');
    icon.width = 18;
    icon.height = 12;
    const iconContext = icon.getContext('2d');
    iconContext.fillStyle = '#0f172a';
    iconContext.fillRect(0, 0, 18, 12);
    iconContext.fillStyle = '#f8fafc';
    iconContext.fillRect(3, 3, 12, 6);
    const commonPaint = {animation: false, plugins: {legend: {labels: {usePointStyle: true}}}, renderer, responsive: false};
    const config = type === 'line'
      ? {data: {labels: ['One', 'Two', 'Three', 'Four'], datasets: [
        {label: 'Neutral paints', backgroundColor: radial, borderColor: linear, borderWidth: 5, data: [2, 6, 3, 7], fill: true, pointBackgroundColor: pattern, pointBorderColor: linear, pointRadius: 7, pointStyle: icon},
        {label: 'Pattern points', borderColor: linear, data: [4, 3, 5, 2], pointBackgroundColor: pattern, pointBorderColor: linear, pointRadius: 5},
      ]}}
      : type === 'bar'
        ? {data: {labels: ['One', 'Two', 'Three'], datasets: [{label: 'Pattern bars', backgroundColor: pattern, borderColor: linear, borderWidth: 3, data: [4, 7, 5]}]}}
        : {data: {labels: ['One', 'Two', 'Three'], datasets: [{backgroundColor: [linear, pattern, radial], borderColor: linear, borderWidth: 3, data: [4, 3, 5]}]}};
    const chart = new Chart(canvas, {type, ...config, options: commonPaint});
    chart.$paint = {linear, pattern, radial};
    return chart;
  }

  for (const [name, type] of [['paint-line', 'line'], ['paint-bar', 'bar'], ['paint-doughnut', 'doughnut']]) {
    charts.set(`${name}-canvas`, mountPaint(name, type, 'canvas'));
    charts.set(`${name}-svg`, mountPaint(name, type, 'svg'));
  }

  const exported = ['area', 'histogram', 'pie', 'radar', 'polar', 'scatter', 'bubble', 'log', 'time', 'timeseries'].map((name) => {
    const source = charts.get(`${name}-svg`);
    const before = source.$chartjsSvgRoot.outerHTML;
    const card = document.createElement('section');
    card.className = 'fixture';
    card.dataset.case = `exported-${name}`;
    card.innerHTML = `<h2>exported ${name}</h2>${source.toSVG()}`;
    document.querySelector('#fixtures').appendChild(card);
    return {name, source, svg: card.querySelector('svg'), unchanged: source.$chartjsSvgRoot.outerHTML === before};
  });
  const exportsValid = exported.every(({source, svg, unchanged}) => {
    const xml = new DOMParser().parseFromString(source.toSVG(), 'image/svg+xml');
    return unchanged && svg?.getAttribute('xmlns') === 'http://www.w3.org/2000/svg'
      && svg?.getAttribute('width') === String(source.width) && !svg?.getAttribute('style')
      && !svg?.hasAttribute('aria-hidden') && !svg?.querySelector('[data-render-id]')
      && !xml.querySelector('parsererror');
  });
  const polarTooltipChart = charts.get('polar-svg');
  polarTooltipChart.tooltip.setActiveElements([{datasetIndex: 0, index: 1}], {x: 210, y: 100});
  polarTooltipChart.draw();
  const radialTooltip = document.querySelector('[data-case="polar-svg"] [data-chart-tooltip]')?.getAttribute('aria-hidden') === 'false';

  const htmlTooltipChart = mount('html-tooltip', 'line', {
    labels: ['One', 'Two', 'Three'],
    datasets: [
      {label: 'Revenue', data: [2, 5, 3], borderColor: '#2563eb', pointStyle: 'circle'},
      {label: 'Cost', data: [4, 2, 6], borderColor: '#dc2626'},
    ],
  }, {
    plugins: {
      legend: false,
      tooltip: {
        backgroundColor: '#102030',
        borderColor: '#93c5fd',
        borderWidth: 2,
        callbacks: {
          footer: () => 'Footer',
          label: (item) => `<b>${item.dataset.label}</b>`,
          title: () => 'Title',
        },
        cornerRadius: {bottomLeft: 4, bottomRight: 5, topLeft: 2, topRight: 3},
        position: 'nearest',
        usePointStyle: true,
      },
    },
  }, 'svg');
  htmlTooltipChart.tooltip.setActiveElements([{datasetIndex: 0, index: 1}, {datasetIndex: 1, index: 1}], {x: 210, y: 100});
  htmlTooltipChart.draw();
  const tooltipRoot = document.querySelector('[data-case="html-tooltip-svg"] [data-chart-tooltip]');
  const tooltipVisible = tooltipRoot?.getAttribute('aria-hidden') === 'false';
  const tooltipAboveSvg = tooltipRoot?.parentElement.lastElementChild === tooltipRoot;
  const tooltipSafe = tooltipRoot?.querySelector('b') === null && tooltipRoot?.textContent.includes('<b>Revenue</b>');
  const tooltipPointStyle = Boolean(tooltipRoot?.querySelector('[data-chart-tooltip-marker] svg path'));
  htmlTooltipChart.tooltip.handleEvent({type: 'mouseout', x: 0, y: 0}, false, true);
  htmlTooltipChart.draw();
  const tooltipHidden = tooltipRoot?.getAttribute('aria-hidden') === 'true';
  htmlTooltipChart.tooltip.setActiveElements([{datasetIndex: 0, index: 1}], {x: 210, y: 100});
  htmlTooltipChart.draw();
  const tooltipReused = document.querySelector('[data-case="html-tooltip-svg"] [data-chart-tooltip]') === tooltipRoot;
  htmlTooltipChart.options.renderer = 'canvas';
  htmlTooltipChart.update('none');
  htmlTooltipChart.draw();
  const tooltipRemovedForCanvas = !document.querySelector('[data-case="html-tooltip-svg"] [data-chart-tooltip]');
  htmlTooltipChart.options.renderer = 'svg';
  htmlTooltipChart.update('none');
  htmlTooltipChart.tooltip.setActiveElements([{datasetIndex: 0, index: 1}], {x: 210, y: 100});
  htmlTooltipChart.draw();
  const tooltipRestoredForSvg = document.querySelector('[data-case="html-tooltip-svg"] [data-chart-tooltip]')?.getAttribute('aria-hidden') === 'false';

  function assertSvgNoCanvas() {
    const host = document.createElement('div');
    host.style.width = '320px';
    host.style.height = '180px';
    document.body.appendChild(host);
    const createElement = document.createElement.bind(document);
    const getContext = HTMLCanvasElement.prototype.getContext;
    const OriginalOffscreenCanvas = window.OffscreenCanvas;
    let forbidden = false;
    document.createElement = function(name, ...args) {
      if (String(name).toLowerCase() === 'canvas') {
        forbidden = true;
      }
      return createElement(name, ...args);
    };
    HTMLCanvasElement.prototype.getContext = function(...args) {
      if (args[0] === '2d') {
        forbidden = true;
      }
      return getContext.call(this, ...args);
    };
    if (OriginalOffscreenCanvas) {
      window.OffscreenCanvas = function(...args) {
        forbidden = true;
        return new OriginalOffscreenCanvas(...args);
      };
    }
    try {
      const paint = {
        type: 'linear-gradient', x0: 0, y0: 0, x1: 320, y1: 0,
        colorStops: [{offset: 0, color: '#2563eb'}, {offset: 1, color: '#ec4899'}]
      };
      const strictCases = [
        ['line', {labels: ['A', 'B', 'C'], datasets: [{data: [1, 3, 2], borderColor: paint, backgroundColor: paint, fill: true}]}, {plugins: {title: {display: true, text: 'Strict'}, legend: {display: true}}}],
        ['bar', {labels: ['A', 'B'], datasets: [{data: [1, 3], backgroundColor: paint}]}, {}],
        ['histogram', {datasets: [{data: [{xMin: 0, xMax: 2, y: 1}, {xMin: 2, xMax: 5, y: 3}], backgroundColor: paint}]}, {}],
        ['doughnut', {labels: ['A', 'B'], datasets: [{data: [1, 3], backgroundColor: paint}]}, {}],
        ['pie', {labels: ['A', 'B'], datasets: [{data: [1, 3], backgroundColor: paint}]}, {}],
        ['scatter', {datasets: [{data: [{x: 1, y: 2}, {x: 3, y: 4}], showLine: true, borderColor: paint, backgroundColor: paint, fill: true}]}, {}],
        ['bubble', {datasets: [{data: [{x: 1, y: 2, r: 4}, {x: 3, y: 4, r: 8}], backgroundColor: paint}]}, {}],
        ['radar', {labels: ['A', 'B', 'C'], datasets: [{data: [1, 3, 2], borderColor: paint, backgroundColor: paint, fill: true}]}, {}],
        ['polarArea', {labels: ['A', 'B'], datasets: [{data: [1, 3], backgroundColor: paint}]}, {}],
        ['line', {datasets: [{data: [{x: 1, y: 1}, {x: 10, y: 10}], borderColor: paint}]}, {scales: {x: {type: 'logarithmic'}, y: {type: 'logarithmic'}}}],
        ['line', {datasets: [{data: [{x: '2026-01-01', y: 1}, {x: '2026-01-02', y: 2}], borderColor: paint}]}, {scales: {x: {type: 'time', time: {unit: 'day'}}}}],
        ['line', {datasets: [{data: [{x: '2026-01-01', y: 1}, {x: '2026-01-02', y: 2}], borderColor: paint}]}, {scales: {x: {type: 'timeseries', time: {unit: 'day'}}}}],
      ];
      const charts = strictCases.map(([type, data, options]) => {
        const target = document.createElement('div');
        target.style.width = '320px';
        target.style.height = '180px';
        host.appendChild(target);
        return new Chart(target, {type, data, options: {animation: false, renderer: 'svg', responsive: false, ...options}});
      });
      const line = charts[0];
      line.resize(320, 180);
      line.data.datasets[0].data[1] = 4;
      line.update('none');
      const point = line.getDatasetMeta(0).data[1];
      const interaction = line.getElementsAtEventForMode({type: 'mousemove', x: point.x, y: point.y, native: null}, 'nearest', {intersect: true}, false);
      line.tooltip.setActiveElements([{datasetIndex: 0, index: 1}], {x: point.x, y: point.y});
      line.draw();
      const valid = !forbidden && charts.every((chart) => chart.canvas === null && chart.ctx === null)
        && interaction.length === 1 && host.querySelectorAll('svg').length === strictCases.length && host.querySelectorAll('canvas').length === 0;
      charts.forEach((chart) => chart.destroy());
      return valid && host.querySelectorAll('svg, canvas').length === 0;
    } finally {
      document.createElement = createElement;
      HTMLCanvasElement.prototype.getContext = getContext;
      if (OriginalOffscreenCanvas) {
        window.OffscreenCanvas = OriginalOffscreenCanvas;
      }
      host.remove();
    }
  }

  function assertRendererSurfaceSwitch() {
    const host = document.createElement('div');
    document.body.appendChild(host);
    const paint = {
      type: 'linear-gradient', x0: 0, y0: 0, x1: 320, y1: 0,
      colorStops: [{offset: 0, color: '#2563eb'}, {offset: 1, color: '#ec4899'}]
    };
    const cases = [
      ['line', {labels: ['A', 'B', 'C'], datasets: [{data: [1, 3, 2], borderColor: paint, backgroundColor: paint, fill: true}]}, {plugins: {title: {display: true, text: 'Switch'}, legend: {display: true}}}],
      ['bar', {labels: ['A', 'B'], datasets: [{data: [1, 3], backgroundColor: '#2563eb'}]}, {}],
      ['histogram', {datasets: [{data: [{xMin: 0, xMax: 2, y: 1}, {xMin: 2, xMax: 5, y: 3}], backgroundColor: '#2563eb'}]}, {}],
      ['doughnut', {labels: ['A', 'B'], datasets: [{data: [1, 3], backgroundColor: ['#2563eb', '#ec4899']}]}, {}],
      ['pie', {labels: ['A', 'B'], datasets: [{data: [1, 3], backgroundColor: ['#2563eb', '#ec4899']}]}, {}],
      ['radar', {labels: ['A', 'B', 'C'], datasets: [{data: [1, 3, 2], backgroundColor: '#2563eb'}]}, {}],
      ['polarArea', {labels: ['A', 'B'], datasets: [{data: [1, 3], backgroundColor: ['#2563eb', '#ec4899']}]}, {}],
      ['scatter', {datasets: [{data: [{x: 1, y: 2}, {x: 3, y: 4}], showLine: true, backgroundColor: '#2563eb'}]}, {}],
      ['bubble', {datasets: [{data: [{x: 1, y: 2, r: 4}, {x: 3, y: 4, r: 8}], backgroundColor: '#2563eb'}]}, {}],
    ];
    const valid = cases.every(([type, data, options]) => {
      const target = document.createElement('div');
      target.style.width = '320px';
      target.style.height = '180px';
      host.appendChild(target);
      const chart = new Chart(target, {type, data, options: {animation: false, renderer: 'canvas', responsive: false, ...options}});
      const canvasOnly = target.querySelectorAll('canvas').length === 1 && target.querySelectorAll('svg').length === 0;
      chart.options.renderer = 'svg';
      chart.update('none');
      const svgOnly = target.querySelectorAll('canvas').length === 0 && target.querySelectorAll('svg').length === 1;
      chart.options.renderer = 'canvas';
      chart.update('none');
      const canvasAgain = target.querySelectorAll('canvas').length === 1 && target.querySelectorAll('svg').length === 0;
      chart.destroy();
      return canvasOnly && svgOnly && canvasAgain;
    });
    host.remove();
    return valid;
  }

  const svgNoCanvas = assertSvgNoCanvas();
  const rendererSurfaceSwitch = assertRendererSurfaceSwitch();
  const svgCharts = document.querySelectorAll('[data-case$="-svg"] svg[data-chart-svg]');
  const line = document.querySelector('[data-case="line-svg"] [data-svg-part="line"] path');
  const fill = document.querySelector('[data-case="area-svg"] [data-svg-part="fill"] path');
  const legend = document.querySelector('[data-case="legend-svg"] [data-legend-role="symbol"]');
  const histogramBars = [...document.querySelectorAll('[data-case="histogram-svg"] [data-svg-part="bars"] > g')];
  const histogramWidths = histogramBars.map((bar) => bar.getBBox().width);
  const radarGrid = document.querySelector('[data-case="radar-svg"] [data-svg-part="radial-grid"] path');
  const polarGrid = document.querySelector('[data-case="polar-svg"] [data-svg-part="radial-grid"] path');
  const scatter = document.querySelectorAll('[data-case="scatter-svg"] [data-svg-part="points"] path').length === 3
    && Boolean(document.querySelector('[data-case="scatter-svg"] [data-svg-part="line"] path'));
  const bubble = document.querySelectorAll('[data-case="bubble-svg"] [data-svg-part="points"] path').length === 3;
  const cartesianScales = ['log', 'time', 'timeseries'].every((name) => {
    const root = `[data-case="${name}-svg"] [data-scale-id="x"]`;
    return document.querySelector(`${root} [data-svg-part="grid"]`)
      && document.querySelector(`${root} [data-svg-part="labels"] text`);
  });
  const paintChart = charts.get('paint-line-svg');
  const canvasExport = charts.get('paint-line-canvas').toBase64Image();
  const paintRoot = document.querySelector('[data-case="paint-line-svg"] svg[data-chart-svg]');
  const paintDefinitions = paintRoot?.querySelectorAll('defs [data-svg-paint]').length || 0;
  const canvasPointStyle = document.querySelectorAll('[data-case="paint-line-svg"] [data-svg-part="points"] image').length === 4
    && Boolean(document.querySelector('[data-case="paint-line-svg"] [data-legend-role="symbol-image"]'));
  const paintAttributes = [...document.querySelectorAll('[data-case^="paint-"] svg [fill], [data-case^="paint-"] svg [stroke]')]
    .map((element) => `${element.getAttribute('fill')} ${element.getAttribute('stroke')}`).join(' ');
  const paintExport = paintChart.toSVG();
  const firstPaintGradient = paintRoot?.querySelector('defs linearGradient[data-svg-paint]');
  paintChart.$paint.linear.x1 = 360;
  paintChart.update('none');
  const paintUpdated = firstPaintGradient === paintRoot?.querySelector('defs linearGradient[data-svg-paint]')
    && firstPaintGradient?.getAttribute('x2') === '360';
  const result = {
    fill: Boolean(fill?.getAttribute('clip-path')),
    exportsValid,
    histogram: histogramWidths.length === 3 && histogramWidths[0] < histogramWidths[1] && histogramWidths[1] < histogramWidths[2],
    radial: Boolean(radarGrid?.getAttribute('d')) && /A/.test(polarGrid?.getAttribute('d') || ''),
    radialTooltip,
    scatter,
    bubble,
    cartesianScales,
    legend: /A15,[^,]+,0,1,1/.test(legend?.getAttribute('d') || ''),
    legacySvgRoots: document.querySelectorAll('svg[data-chart-svg-layer]').length,
    line: Boolean(line?.getAttribute('d')),
    svgCharts: svgCharts.length,
    svgNoCanvas,
    rendererSurfaceSwitch,
    paintDefinitions: paintDefinitions >= 3,
    canvasPointStyle,
    canvasPointExport: /data-svg-part="points"[\s\S]*?<image[^>]+href="data:image\/png;base64,/.test(paintExport),
    paintExport: paintExport.includes('linearGradient') && paintExport.includes('radialGradient') && paintExport.includes('<pattern') && !paintExport.includes('[object Canvas'),
    canvasExport: canvasExport.startsWith('data:image/png;base64,'),
    paintSafe: !paintAttributes.includes('[object CanvasGradient]') && !paintAttributes.includes('[object CanvasPattern]'),
    paintUpdated,
    text: document.querySelectorAll('[data-case="line-svg"] text:not([data-svg-measurement])').length,
    tooltipHidden,
    tooltipPointStyle,
    tooltipRemovedForCanvas,
    tooltipRestoredForSvg,
    tooltipReused,
    tooltipSafe,
    tooltipVisible,
    tooltipAboveSvg,
  };
  document.querySelector('#result').textContent = JSON.stringify(result);
  document.body.dataset.svgReady = 'true';
</script>
</body>
