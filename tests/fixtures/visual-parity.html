<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff;font-family:Arial,sans-serif}#atlas{display:grid;grid-template-columns:450px 450px;gap:20px}.surface{width:450px;height:250px;box-sizing:border-box;padding:0;border:0;background:#fff;overflow:hidden}canvas,svg{display:block}</style>
<div id="atlas"></div><output id="result"></output>
<script type="module">
window.addEventListener('error',event=>{document.querySelector('#result').textContent=JSON.stringify({error:event.message});document.body.dataset.visualReady='true'});
import {ArcElement,BarController,BarElement,BubbleController,CategoryScale,Chart,DoughnutController,Filler,Legend,LineController,LineElement,LinearScale,PieController,PointElement,RadialLinearScale,RadarController,ScatterController,Title,Tooltip} from '/dist/chart.js';
Chart.register(ArcElement,BarController,BarElement,BubbleController,CategoryScale,DoughnutController,Filler,Legend,LineController,LineElement,LinearScale,PieController,PointElement,RadialLinearScale,RadarController,ScatterController,Title,Tooltip);
const colors=['#2563eb','#dc2626','#16a34a','#f59e0b'];
const line=(extra={})=>({type:'line',data:{labels:['A','B','C','D'],datasets:[{data:[2,6,3,7],borderColor:colors[0],backgroundColor:'rgba(37,99,235,.35)',borderWidth:3,pointRadius:4,...extra}]}});
const fixtures={
 'line-straight':line(), 'line-bezier-gaps':line({data:[2,null,3,7],tension:.4,spanGaps:true}), 'line-stepped':line({stepped:'middle'}),
 'bar-grouped':{type:'bar',data:{labels:['A','B','C'],datasets:[{data:[4,7,5],backgroundColor:colors[0],borderColor:'#1d4ed8',borderWidth:2,borderRadius:5},{data:[3,5,6],backgroundColor:colors[1]}]}},
 'bar-horizontal-floating':{type:'bar',data:{labels:['A','B','C'],datasets:[{data:[[1,5],[2,7],[0,4]],backgroundColor:colors[2],borderColor:'#15803d',borderWidth:2}]},options:{indexAxis:'y'}},
 'bar-stacked':{type:'bar',data:{labels:['A','B','C'],datasets:[{data:[3,4,2],backgroundColor:colors[0]},{data:[2,3,5],backgroundColor:colors[1]}]},options:{scales:{x:{stacked:true},y:{stacked:true}}}},
 'doughnut':{type:'doughnut',data:{labels:['A','B','C'],datasets:[{data:[4,3,5],backgroundColor:colors,borderColor:'#fff',borderWidth:3,borderRadius:4}]}},
 'arc-multiturn':{type:'doughnut',data:{labels:['A','B'],datasets:[{data:[3,2],backgroundColor:'rgba(37,99,235,.4)',borderColor:'rgba(220,38,38,.6)',borderWidth:5}]},options:{circumference:450,rotation:-90}},
 'scatter':{type:'scatter',data:{datasets:[{data:[{x:1,y:2},{x:4,y:7},{x:8,y:3}],showLine:true,borderColor:colors[0],pointBackgroundColor:colors[1],pointRadius:[3,6,4]}]}},
 'bubble':{type:'bubble',data:{datasets:[{data:[{x:1,y:2,r:4},{x:3,y:6,r:12},{x:7,y:3,r:24}],backgroundColor:'rgba(22,163,74,.5)',borderColor:'#15803d'}]}},
 'radar':{type:'radar',data:{labels:['N','E','S','W','C'],datasets:[{data:[4,7,5,8,6],backgroundColor:'rgba(37,99,235,.3)',borderColor:colors[0],pointRadius:4,fill:true}]}},
 'filler-boundaries':{type:'line',data:{labels:['A','B','C','D'],datasets:[{data:[2,4,3,5],fill:'origin',backgroundColor:'rgba(37,99,235,.25)',borderColor:colors[0]},{data:[4,6,5,7],fill:{value:4},backgroundColor:'rgba(220,38,38,.2)',borderColor:colors[1]}]},options:{scales:{y:{min:0,max:10}}}},
 'filler-stack-shape':{type:'line',data:{labels:['A','B','C','D'],datasets:[{data:[2,3,2,4],fill:false,borderColor:colors[2]},{data:[4,6,5,7],fill:'stack',backgroundColor:'rgba(37,99,235,.25)',borderColor:colors[0]}]}},
 'legend-title':{...line(),options:{plugins:{title:{display:true,text:'Parity title'},subtitle:{display:true,text:'Subtitle'},legend:{display:true}}}},
 'paint-gradient':{type:'bar',data:{labels:['A','B','C'],datasets:[{data:[3,6,4],backgroundColor:{type:'linear-gradient',x0:0,y0:0,x1:420,y1:0,colorStops:[{offset:0,color:'#2563eb'},{offset:1,color:'#ec4899'}]},borderColor:'#1d4ed8',borderWidth:2}]}}
};
const WIDTH=450,HEIGHT=250,atlas=document.querySelector('#atlas'),charts={},rects={};
function createConfig(input,renderer){const config=structuredClone(input);config.options={animation:false,responsive:false,maintainAspectRatio:false,devicePixelRatio:1,font:{family:'Arial',size:13},plugins:{legend:false},...(config.options||{}),renderer};return config}
for(const [name,input] of Object.entries(fixtures)){for(const renderer of ['canvas','svg']){const host=document.createElement('div');host.className='surface';host.dataset.fixture=name;host.dataset.renderer=renderer;atlas.appendChild(host);const chart=new Chart(host,createConfig(input,renderer));chart.resize(WIDTH,HEIGHT);chart.update('none');charts[`${name}-${renderer}`]=chart}}
function layout(chart){const a=chart.chartArea;return {size:[chart.width,chart.height],chartArea:[a.left,a.top,a.right,a.bottom],scales:Object.fromEntries(Object.entries(chart.scales).map(([id,s])=>[id,[s.left,s.top,s.right,s.bottom]])),elements:chart.getSortedVisibleDatasetMetas().map(meta=>meta.data.length)}}
function ready(){for(const [key,chart] of Object.entries(charts)){const host=chart.canvas||chart.$chartjsSvgRoot;const rect=host.getBoundingClientRect();rects[key]=[rect.x,rect.y,rect.width,rect.height]}document.querySelector('#result').textContent=JSON.stringify({ready:true,rects,layouts:Object.fromEntries(Object.entries(charts).map(([key,chart])=>[key,layout(chart)]))});document.body.dataset.visualReady='true'}
document.fonts.ready.then(()=>requestAnimationFrame(ready),ready);
</script>
