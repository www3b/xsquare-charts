<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff;font-family:Arial,sans-serif}#atlas{display:grid;grid-template-columns:450px 450px;gap:20px}.surface{width:450px;height:250px;box-sizing:border-box;padding:0;border:0;background:#fff;overflow:hidden}canvas,svg{display:block}</style>
<div id="atlas"></div><output id="result"></output>
<script type="module">
window.addEventListener('error',event=>{document.querySelector('#result').textContent=JSON.stringify({error:event.message});document.body.dataset.visualReady='true'});
import {Chart} from '/dist/chart.js';
const colors=['#2563eb','#dc2626','#16a34a','#f59e0b'];
const line=(extra={})=>({type:'line',data:{labels:['A','B','C','D'],datasets:[{data:[2,6,3,7],borderColor:colors[0],backgroundColor:'rgba(37,99,235,.35)',borderWidth:3,pointRadius:4,...extra}]}});
const fixtures={
 'line-straight':line(), 'line-bezier-gaps':line({data:[2,null,3,7],tension:.4,spanGaps:true}), 'line-stepped':line({stepped:'middle'}),
 'bar-grouped':{type:'bar',data:{labels:['A','B','C'],datasets:[{data:[4,7,5],backgroundColor:colors[0],borderColor:'#1d4ed8',borderWidth:2,borderRadius:5},{data:[3,5,6],backgroundColor:colors[1]}]}},
 'bar-horizontal-floating':{type:'bar',data:{labels:['A','B','C'],datasets:[{data:[[1,5],[2,7],[0,4]],backgroundColor:colors[2],borderColor:'#15803d',borderWidth:2}]},options:{indexAxis:'y'}},
 'bar-stacked':{type:'bar',data:{labels:['A','B','C'],datasets:[{data:[3,4,2],backgroundColor:colors[0]},{data:[2,3,5],backgroundColor:colors[1]}]},options:{scales:{x:{stacked:true},y:{stacked:true}}}},
 'doughnut':{type:'doughnut',data:{labels:['A','B','C'],datasets:[{data:[4,3,5],backgroundColor:colors,borderColor:'#fff',borderWidth:3,borderRadius:4}]}},
 'arc-multiturn':{type:'doughnut',data:{labels:['A','B'],datasets:[{data:[3,2],backgroundColor:'rgba(37,99,235,.4)',borderColor:'rgba(220,38,38,.6)',borderWidth:5}]},options:{circumference:450,rotation:-90}},
 'scatter':{type:'scatter',data:{datasets:[{data:[{x:1,y:2},{x:4,y:7},{x:8,y:3}],showLine:true,borderColor:colors[0],pointBackgroundColor:colors[1],pointRadius:[3,6,4]}]}},
 'bubble':{type:'bubble',data:{datasets:[{data:[{x:1,y:2,r:4},{x:3,y:6,r:12},{x:7,y:3,r:24}],backgroundColor:'rgba(22,163,74,.5)',borderColor:'#15803d'}]}},
 'radar':{type:'radar',data:{labels:['N','E','S','W','C'],datasets:[{data:[4,7,5,8,6],backgroundColor:'rgba(37,99,235,.3)',borderColor:colors[0],pointRadius:4,fill:true}]}},
 'filler-boundaries':{type:'line',data:{labels:['A','B','C','D'],datasets:[{data:[2,4,3,5],fill:'origin',backgroundColor:'rgba(37,99,235,.25)',borderColor:colors[0]},{data:[4,6,5,7],fill:{value:4},backgroundColor:'rgba(220,38,38,.2)',borderColor:colors[1]}]},options:{scales:{y:{min:0,max:10}}}},
 'filler-stack-shape':{type:'line',data:{labels:['A','B','C','D'],datasets:[{data:[2,3,2,4],fill:false,borderColor:colors[2]},{data:[4,6,5,7],fill:'stack',backgroundColor:'rgba(37,99,235,.25)',borderColor:colors[0]}]}},
 'legend-title':{...line({label:'Dataset 1'}),options:{plugins:{title:{display:true,text:'Parity title'},subtitle:{display:true,text:'Subtitle'},legend:{display:true}}}},
 'paint-gradient':{type:'bar',data:{labels:['A','B','C'],datasets:[{data:[3,6,4],backgroundColor:{type:'linear-gradient',x0:0,y0:0,x1:420,y1:0,colorStops:[{offset:0,color:'#2563eb'},{offset:1,color:'#ec4899'}]},borderColor:'#1d4ed8',borderWidth:2}]}}
};
const WIDTH=450,HEIGHT=250,atlas=document.querySelector('#atlas'),charts={},rects={};
function createConfig(input,renderer){const config=structuredClone(input),legacy=config.options||{},plugins={legend:false,...(legacy.plugins||{})};config.data={labels:config.data.labels||[],series:(config.data.datasets||[]).map(({label,...series})=>({...series,name:label??series.name}))};Object.assign(config,{renderer,animation:false,responsive:false,maintainAspectRatio:false,devicePixelRatio:1,font:{family:'Arial',size:13},indexAxis:legacy.indexAxis,scales:legacy.scales,legend:plugins.legend,title:plugins.title,subtitle:plugins.subtitle,tooltip:plugins.tooltip});delete config.options;return config}
for(const [name,input] of Object.entries(fixtures)){for(const renderer of ['canvas','svg']){const host=document.createElement('div');host.className='surface';host.dataset.fixture=name;host.dataset.renderer=renderer;atlas.appendChild(host);const chart=new Chart(host,createConfig(input,renderer));chart.resize(WIDTH,HEIGHT);chart.update('none');charts[`${name}-${renderer}`]=chart}}
function layout(chart){const a=chart.chartArea;return {size:[chart.width,chart.height],chartArea:[a.left,a.top,a.right,a.bottom],scales:Object.fromEntries(Object.entries(chart.scales).map(([id,s])=>[id,[s.left,s.top,s.right,s.bottom]])),elements:chart.getSortedVisibleDatasetMetas().map(meta=>meta.data.length)}}
const beforeFontLayouts=Object.fromEntries(Object.entries(charts).map(([key,chart])=>[key,layout(chart)]));
function number(value){return Number.isFinite(value)?Number(value.toFixed(4)):null}
function measured(element){let length=null,bbox=null;try{length=element.getComputedTextLength()}catch{}try{bbox=element.getBBox().width}catch{}return {length:number(length),bbox:number(bbox)}}
function elementFont(element){const style=getComputedStyle(element);return {styleFont:element.style.font,font:element.getAttribute('font'),fontFamily:element.getAttribute('font-family'),fontSize:element.getAttribute('font-size'),fontStyle:element.getAttribute('font-style'),fontWeight:element.getAttribute('font-weight'),computedFamily:style.fontFamily,computedSize:style.fontSize,computedStyle:style.fontStyle,computedWeight:style.fontWeight}}
function paintedText(chart,text){return Array.from(chart.$chartjsSvgRoot.querySelectorAll('[data-svg-text-role="text"]')).find(element=>element.textContent===String(text))||null}
function probeSvgText(font,text){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width','500');svg.setAttribute('height','100');svg.style.cssText='position:absolute;left:-10000px;top:0';document.body.appendChild(svg);const make=(name)=>{const element=document.createElementNS('http://www.w3.org/2000/svg','text');element.textContent=text;element.setAttribute('x','0');element.setAttribute('y','20');svg.appendChild(element);return {name,element}};const a=make('attribute-font');a.element.setAttribute('font',font.string);const b=make('style-font');b.element.style.font=font.string;const c=make('presentation-font');c.element.style.font=font.string;c.element.setAttribute('font-family',font.family);c.element.setAttribute('font-size',String(font.size));c.element.setAttribute('font-style',font.style||'');if(font.weight!==undefined&&font.weight!==null)c.element.setAttribute('font-weight',font.weight);const result=Object.fromEntries([a,b,c].map(({name,element})=>[name,{...elementFont(element),...measured(element)}]));svg.remove();return result}
function measureTextProbe(name,canvasChart,svgChart,text,font){const context=canvasChart.ctx;context.save();context.font=font.string;const canvasContextFont=context.font;context.restore();const svgRenderer=svgChart._renderer;const svgWidth=svgRenderer.measureText(text,font.string);const measureNode=svgChart.$chartjsSvgRoot.querySelector('[data-svg-measurement="true"]');const painted=paintedText(svgChart,text);return {name,text:String(text),font:font.string,canvas:number(canvasChart._renderer.measureText(text,font.string)),canvasContextFont,svgMeasure:number(svgWidth),svgMeasureNode:{...elementFont(measureNode),...measured(measureNode)},painted:painted?{...elementFont(painted),...measured(painted)}:null,probes:probeSvgText(font,String(text))}}
function addScaleTextProbes(result,name,canvasChart,svgChart){for(const [scaleId,scale] of Object.entries(svgChart.scales)){const font=scale._resolveTickFontOptions(0);const labels=scale.getTicks().map(tick=>String(tick.label)).filter((label,index,labels)=>labels.indexOf(label)===index).slice(0,6);for(const label of labels)result.push(measureTextProbe(`${name}:${scaleId}`,canvasChart,svgChart,label,font))}}
function addPaintedTextProbe(result,name,canvasChart,svgChart,text){const element=paintedText(svgChart,text);if(!element)return;const font={string:element.style.font,family:element.getAttribute('font-family'),size:Number(element.getAttribute('font-size')),style:element.getAttribute('font-style'),weight:element.getAttribute('font-weight')||undefined};result.push(measureTextProbe(name,canvasChart,svgChart,text,font))}
function createDiagnosticCharts(){const mount=document.createElement('div');mount.style.cssText='position:absolute;left:-10000px;top:0;width:450px';document.body.appendChild(mount);const variants={
  'scales-hidden':{scales:{x:{display:false},y:{display:false}},plugins:{legend:false,title:{display:false},subtitle:{display:false}}},
  'ticks-hidden':{scales:{x:{ticks:{display:false}},y:{ticks:{display:false}}},plugins:{legend:false,title:{display:false},subtitle:{display:false}}},
  'ticks-only':{scales:{x:{grid:{display:false},border:{display:false}},y:{grid:{display:false},border:{display:false}}},plugins:{legend:false,title:{display:false},subtitle:{display:false}}},
  'fixed-scale-boxes':{scales:{x:{afterFit:scale=>{scale.height=32}},y:{afterFit:scale=>{scale.width=40}}},plugins:{legend:false,title:{display:false},subtitle:{display:false}}}
};const result={};for(const [name,options] of Object.entries(variants)){for(const renderer of ['canvas','svg']){const host=document.createElement('div');host.className='surface';mount.appendChild(host);const config=name==='fixed-scale-boxes'?createConfig(line(),renderer):createConfig({...line(),options},renderer);if(name==='fixed-scale-boxes'){config.scales=options.scales;config.legend=options.plugins.legend;config.title=options.plugins.title;config.subtitle=options.plugins.subtitle}const chart=new Chart(host,config);chart.resize(WIDTH,HEIGHT);chart.update('none');result[`${name}-${renderer}`]=chart}}return {mount,charts:result}}
function pointGeometry(chart){return chart.getSortedVisibleDatasetMetas().flatMap(meta=>meta.data.map(point=>[number(point.x),number(point.y)]))}
function maxDelta(first,second){return Math.max(...first.map((value,index)=>Math.abs(value-second[index])))}
function diagnosticData(){const afterFontLayouts=Object.fromEntries(Object.entries(charts).map(([key,chart])=>[key,layout(chart)]));const diagnostic=createDiagnosticCharts();const text=[];for(const name of ['line-straight','bar-grouped','legend-title','radar']){const canvasChart=charts[`${name}-canvas`],svgChart=charts[`${name}-svg`];addScaleTextProbes(text,name,canvasChart,svgChart);if(name==='legend-title'){for(const label of ['Dataset 1','Parity title','Subtitle'])addPaintedTextProbe(text,`legend-title:${label}`,canvasChart,svgChart,label)}}const layoutDeltas=Object.keys(fixtures).map(name=>{const canvas=afterFontLayouts[`${name}-canvas`],svg=afterFontLayouts[`${name}-svg`],x=canvas.scales.x||[0,0,0,0],sx=svg.scales.x||[0,0,0,0],y=canvas.scales.y||[0,0,0,0],sy=svg.scales.y||[0,0,0,0];return {fixture:name,left:number(svg.chartArea[0]-canvas.chartArea[0]),top:number(svg.chartArea[1]-canvas.chartArea[1]),right:number(svg.chartArea[2]-canvas.chartArea[2]),bottom:number(svg.chartArea[3]-canvas.chartArea[3]),yWidth:number((sy[2]-sy[0])-(y[2]-y[0])),xHeight:number((sx[3]-sx[1])-(x[3]-x[1]))}});const isolation=Object.keys(diagnostic.charts).filter(key=>key.endsWith('-canvas')).map(canvasKey=>{const svgKey=canvasKey.replace(/-canvas$/,'-svg'),canvas=diagnostic.charts[canvasKey],svg=diagnostic.charts[svgKey],canvasLayout=layout(canvas),svgLayout=layout(svg);return {variant:canvasKey.replace(/-canvas$/,''),layoutDelta:number(maxDelta([...canvasLayout.chartArea,...Object.values(canvasLayout.scales).flat()],[...svgLayout.chartArea,...Object.values(svgLayout.scales).flat()])),canvasChartArea:canvasLayout.chartArea,svgChartArea:svgLayout.chartArea,pointDelta:number(maxDelta(pointGeometry(canvas).flat(),pointGeometry(svg).flat()))}});const fontReadiness=Object.keys(charts).map(key=>({chart:key,delta:number(maxDelta([...beforeFontLayouts[key].chartArea,...Object.values(beforeFontLayouts[key].scales).flat()],[...afterFontLayouts[key].chartArea,...Object.values(afterFontLayouts[key].scales).flat()]))}));const cacheLocality=['line-straight','bar-grouped'].map(name=>({fixture:name,xShared:charts[`${name}-canvas`].scales.x?charts[`${name}-canvas`].scales.x._longestTextCache===charts[`${name}-svg`].scales.x._longestTextCache:false,yShared:charts[`${name}-canvas`].scales.y?charts[`${name}-canvas`].scales.y._longestTextCache===charts[`${name}-svg`].scales.y._longestTextCache:false}));diagnostic.mount.remove();return {fontStatus:document.fonts.status,fontReadiness,text,layoutDeltas,isolation,cacheLocality}}
function ready(){for(const chart of Object.values(charts))chart.update('none');for(const [key,chart] of Object.entries(charts)){const host=chart.canvas||chart.$chartjsSvgRoot;const rect=host.getBoundingClientRect();rects[key]=[rect.x,rect.y,rect.width,rect.height]}document.querySelector('#result').textContent=JSON.stringify({ready:true,rects,layouts:Object.fromEntries(Object.entries(charts).map(([key,chart])=>[key,layout(chart)])),diagnostics:diagnosticData()});document.body.dataset.visualReady='true'}
document.fonts.ready.then(()=>requestAnimationFrame(ready),ready);
</script>
